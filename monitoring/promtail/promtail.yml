server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          __path__: /var/log/app/*.json
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            service: service
            env: env
            method: method
            path: path
            status: status
      - labels:
          level:
          service:
          env:
          method:
          status:
