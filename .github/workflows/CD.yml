name: CD

on:
  push:
    branches:
      - feat/cd
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Write .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # - name: Write .pem files
      #   run: |
      #     echo "${{ secrets.PRIVATE }}" > ./internal/infrastructure/jwt/private_key.pem
      #     echo "${{ secrets.PUBLIC }}" > ./internal/infrastructure/jwt/public_key.pem

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PAT }}

      - name: Build and Push Docker Image
        run: |
          docker compose build
          docker compose push

      # - name: Copy configuration files
      #   uses: appleboy/scp-action@v0.1.0
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     password: ${{ secrets.SERVER_PASSWORD }}
      #     source: "docker-compose.yml"
      #     target: "/root/backend"

      # - name: Deploy
      #   uses: appleboy/ssh-action@v0.1.8
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     password: ${{ secrets.SERVER_PASSWORD }}
      #     script: |
      #       cd /root/backend
      #       echo "${{ secrets.ENV_FILE }}" > .env
      #       chmod 644 .env

      #       docker compose down
      #       sleep 10
      #       docker compose pull
      #       docker compose up -d

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb || sudo apt-get install -f -y
          cloudflared --version

      - name: Copy configuration files via SCP
        run: |
          scp -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname ${{ secrets.SERVER_HOST }}" \
            docker-compose.yml \
            root@${{ secrets.SERVER_HOST }}:/root/backend

      - name: Deploy via SSH through Cloudflare Tunnel
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname ${{ secrets.SERVER_HOST }}" \
            root@${{ secrets.SERVER_HOST }} \
            "cd /root && mkdir /backend && cd backend/ && \
             docker logout ghcr.io && \
             docker login ghcr.io -u '${{ secrets.USERNAME }}' -p '${{ secrets.PAT }}' && \
             docker compose pull && \
             docker compose down --remove-orphans && \
             docker compose up -d && \
             docker image prune -f"

