name: CD

on:
  push:
    branches:
      - feat/cd
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PAT }}

      - name: Build and Push Docker Image
        run: |
          IMAGE=ghcr.io/${{ secrets.USERNAME }}/backend:feat-cd
          docker compose build --no-cache
          docker tag backend_app_1 $IMAGE
          docker push $IMAGE

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "docker-compose.yml"
          target: "/petYar/backend"

      - name: Deploy on Server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /petYar/backend
            echo "${{ secrets.ENV_FILE }}" > .env
            chmod 644 .env

            docker compose down -v
            docker image prune -f
            sleep 5
            docker pull ghcr.io/${{ secrets.USERNAME }}/backend:feat-cd
            docker tag ghcr.io/${USERNAME}/backend:feat-cd backend_app_1:latest
            docker compose up -d
